name = "horrorwriter"
compatibility_date = "2024-11-01"
compatibility_flags = [ "nodejs_compat" ]

# main and [assets] are intentionally absent — the deploy command uses
# `--config dist/server/wrangler.json` which Astro generates with the correct
# paths after the build. Having main here causes the Cloudflare Vite plugin to
# validate the path at build start, before dist/ exists.

# VITE_* vars are baked into the bundle at build time by Astro. They are set
# in Workers Builds → Settings → Build → Variables and secrets (not here),
# but kept here as a reference and for local `npm run dev`. Safe to commit.
# See CLAUDE.md → Infrastructure.
[vars]
VITE_SUPABASE_URL = "https://bmvvugrfnuedjlucmlbw.supabase.co"
VITE_SUPABASE_ANON_KEY = "sb_publishable_-Y5K0e8qQrpsybmuQyyqxg_llQOokRY"
VITE_TRANSCRIBE_URL = "https://horrorwriter-transcribe.orig-beetlebub.workers.dev"
VITE_ENABLE_GOOGLE_LOGIN = "true"
