# Nightly database backup. The Supabase Free plan keeps no backups, so this is the only copy.
# Dumps roles, schema and data, encrypts them, and stores them in a private R2 bucket.
# Restore procedure and one-time setup: docs/ops/backup-and-restore.md
name: Backup

on:
  schedule:
    - cron: '17 10 * * *' # 10:17 UTC, about 02:17 Pacific
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    name: dump and store
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Session pooler URL (port 5432). The direct db.<ref>.supabase.co host is IPv6-only
      # and GitHub's runners cannot reach it.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Check secrets
        run: |
          for v in SUPABASE_DB_URL BACKUP_PASSPHRASE AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; exit 1; fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump
        run: |
          mkdir dump
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f dump/roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f dump/data.sql
          # A dump that silently lost its data must fail the run, not get stored as a backup.
          for f in roles schema data; do test -s "dump/$f.sql" || { echo "::error::$f.sql is empty"; exit 1; }; done
          grep -q 'COPY "public"."profiles"' dump/data.sql || { echo "::error::data.sql has no profiles table"; exit 1; }
          ls -l dump

      - name: Encrypt
        run: |
          STAMP=$(date -u +%Y-%m-%dT%H%MZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          tar -czf - dump | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o "horrorwriter-$STAMP.tar.gz.gpg"
          rm -rf dump
          ls -l "horrorwriter-$STAMP.tar.gz.gpg"

      - name: Store in R2
        run: |
          aws s3 cp "horrorwriter-$STAMP.tar.gz.gpg" "s3://$R2_BUCKET/db/horrorwriter-$STAMP.tar.gz.gpg" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 ls "s3://$R2_BUCKET/db/" --endpoint-url "$R2_ENDPOINT" | tail -3
